<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drives, ISO & VHD Config</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; padding: 2rem; }
        h2 { font-size: 1.5rem; color: #58a6ff; margin-bottom: 0.5rem; }
        p.subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.9rem; }

        .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section-title { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; margin-bottom: 1rem; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.85rem; color: #8b949e; }
        .form-group input, .form-group select { padding: 0.6rem; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #fff; font-size: 0.9rem; }
        .form-group input:focus { border-color: #58a6ff; outline: none; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 0.5rem; font-size: 0.9rem; color: #c9d1d9; }

        .btn { padding: 0.6rem 1.2rem; background: #238636; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; width: fit-content; }
        .btn:hover { background: #2ea043; }
        .btn-danger { background: #da3633; }
        .btn-danger:hover { background: #b62324; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #30363d; }
        th { color: #8b949e; font-weight: 600; background: #1f242d; }

        .output-box { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 0.8rem; font-family: monospace; font-size: 0.85rem; color: #7ee787; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
    <h2>Drives, ISO & VHD Config</h2>
    <p class="subtitle">Mount system disk partitions, ISO files, or VHD loop files and optionally share them via Samba.</p>

    <!-- Section 1: Mount ISO / VHD File -->
    <div class="section">
        <div class="section-title">Mount File Image (ISO / VHD)</div>
        <div class="form-grid">
            <div class="form-group">
                <label>File Path on Server</label>
                <input type="text" id="filePath" placeholder="/mnt/storage/disk.iso">
            </div>
            <div class="form-group">
                <label>Mount Point</label>
                <input type="text" id="mountPoint" placeholder="/media/iso_mount">
            </div>
            <div class="form-group">
                <label>Image Type</label>
                <select id="imageType">
                    <option value="mount_iso_cmd">ISO Image (.iso)</option>
                    <option value="mount_vhd_cmd">VHD / Virtual Disk (.vhd / .img)</option>
                </select>
            </div>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="addToSmb">
            <label for="addToSmb">Automatically share this mount point via SMB</label>
        </div>
        <div class="form-group" id="smbNameGroup" style="margin-top: 0.8rem; max-width: 300px; display: none;">
            <label>SMB Share Name</label>
            <input type="text" id="smbShareName" placeholder="IsoShare">
        </div>
        <br>
        <button class="btn" onclick="mountFileImage()">Mount Image</button>
    </div>

    <!-- Section 2: Local Storage Disks -->
    <div class="section">
        <div class="section-title">Detected System Disks & Partitions</div>
        <button class="btn" style="background: #30363d; margin-bottom: 1rem;" onclick="refreshDrives()">Refresh Disks</button>
        <table>
            <thead>
                <tr>
                    <th>Device</th>
                    <th>Type</th>
                    <th>Filesystem</th>
                    <th>Size</th>
                    <th>Mount Point</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="driveTableBody">
                <tr><td colspan="6" style="text-align: center; color: #8b949e;">Click Refresh Disks to scan system partitions.</td></tr>
            </tbody>
        </table>
    </div>

    <div id="outputBox" class="output-box"></div>

    <script>
        document.getElementById('addToSmb').addEventListener('change', (e) => {
            document.getElementById('smbNameGroup').style.display = e.target.checked ? 'block' : 'none';
        });

        async function mountFileImage() {
            const filePath = document.getElementById('filePath').value.trim();
            const mountPoint = document.getElementById('mountPoint').value.trim();
            const cmdKey = document.getElementById('imageType').value;
            const addToSmb = document.getElementById('addToSmb').checked;
            let shareName = document.getElementById('smbShareName').value.trim();

            if (!filePath || !mountPoint) {
                showOutput('Please provide both file path and mount point.');
                return;
            }

            showOutput(`Mounting ${filePath} to ${mountPoint}...`);

            try {
                const res = await fetch('/api/plugin/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plugin: 'drive_mount',
                        cmd_key: cmdKey,
                        args: { filepath: filePath, mountpoint: mountPoint }
                    })
                });
                const data = await res.json();
                if (data.success) {
                    let msg = `Successfully mounted image at ${mountPoint}.\n` + data.output;
                    if (addToSmb) {
                        if (!shareName) {
                            shareName = mountPoint.split('/').pop() || 'MountedShare';
                        }
                        const smbRes = await addSMBShare(shareName, mountPoint);
                        msg += '\n' + smbRes;
                    }
                    showOutput(msg);
                } else {
                    showOutput(`Failed to mount image: ${data.error}\n${data.output}`);
                }
            } catch (err) {
                showOutput('Error: ' + err.message);
            }
        }

        async function addSMBShare(name, path) {
            try {
                // Fetch existing smb shares data to resolve name conflict
                const dataRes = await fetch('/api/plugin/data?plugin=smb');
                let smbData = await dataRes.json();
                if (!Array.isArray(smbData.shares)) smbData.shares = [];

                // Conflict check and auto rename (e.g. Videos -> Videos2)
                let finalName = name;
                let count = 2;
                while (smbData.shares.some(s => s.name.toLowerCase() === finalName.toLowerCase())) {
                    finalName = `${name}${count}`;
                    count++;
                }

                smbData.shares.push({ name: finalName, path: path, comment: 'Auto-added drive share', read_only: false });

                await fetch('/api/plugin/data?plugin=smb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(smbData)
                });

                return `SMB Share '${finalName}' added successfully for path ${path}.`;
            } catch (err) {
                return `Mounted, but failed to create SMB share: ${err.message}`;
            }
        }

        async function refreshDrives() {
            showOutput('Scanning system disks...');
            try {
                const res = await fetch('/api/plugin/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plugin: 'drive_mount',
                        cmd_key: 'list_drives_cmd',
                        args: {}
                    })
                });
                const data = await res.json();
                if (data.success) {
                    let parsed = JSON.parse(data.output);
                    renderDriveTable(parsed.blockdevices || []);
                    showOutput('Disk scan complete.');
                } else {
                    showOutput('Failed to list disks: ' + data.error);
                }
            } catch (err) {
                showOutput('Disk scan error: ' + err.message);
            }
        }

        function renderDriveTable(devices) {
            const tbody = document.getElementById('driveTableBody');
            tbody.innerHTML = '';

            function processDev(dev) {
                const tr = document.createElement('tr');
                const devPath = `/dev/${dev.name}`;
                const mnt = dev.mountpoint || '-';

                let actionBtn = '';
                if (dev.mountpoint) {
                    actionBtn = `<button class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="unmountDev('${dev.mountpoint}')">Unmount</button>`;
                } else if (dev.fstype) {
                    actionBtn = `<button class="btn" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="promptMountDev('${devPath}')">Mount</button>`;
                }

                tr.innerHTML = `
                    <td><strong>${devPath}</strong></td>
                    <td>${dev.type || ''}</td>
                    <td>${dev.fstype || 'N/A'}</td>
                    <td>${dev.size || ''}</td>
                    <td>${mnt}</td>
                    <td>${actionBtn}</td>
                `;
                tbody.appendChild(tr);

                if (dev.children) {
                    dev.children.forEach(processDev);
                }
            }

            devices.forEach(processDev);
        }

        async function promptMountDev(devPath) {
            const mnt = prompt(`Enter mount path for ${devPath}:`, `/mnt/${devPath.split('/').pop()}`);
            if (!mnt) return;

            try {
                const res = await fetch('/api/plugin/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plugin: 'drive_mount',
                        cmd_key: 'mount_disk_cmd',
                        args: { device: devPath, mountpoint: mnt }
                    })
                });
                const data = await res.json();
                showOutput(data.success ? `Mounted ${devPath} to ${mnt}` : `Mount failed: ${data.error}`);
                refreshDrives();
            } catch (err) {
                showOutput('Mount error: ' + err.message);
            }
        }

        async function unmountDev(mnt) {
            try {
                const res = await fetch('/api/plugin/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plugin: 'drive_mount',
                        cmd_key: 'unmount_disk_cmd',
                        args: { mountpoint: mnt }
                    })
                });
                const data = await res.json();
                showOutput(data.success ? `Unmounted ${mnt}` : `Unmount failed: ${data.error}`);
                refreshDrives();
            } catch (err) {
                showOutput('Unmount error: ' + err.message);
            }
        }

        function showOutput(text) {
            const box = document.getElementById('outputBox');
            box.style.display = 'block';
            box.innerText = text;
        }
    </script>
</body>
</html>
