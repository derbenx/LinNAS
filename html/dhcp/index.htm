<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DHCP Server Config</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; padding: 2rem; }
        h2 { font-size: 1.5rem; color: #58a6ff; margin-bottom: 0.5rem; }
        p.subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.9rem; }

        .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section-title { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; margin-bottom: 1rem; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }

        .status-badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .status-running { background: #238636; color: #fff; }
        .status-stopped { background: #da3633; color: #fff; }
        .status-unknown { background: #6e7681; color: #fff; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.85rem; color: #8b949e; }
        .form-group input, .form-group select { padding: 0.6rem; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #fff; font-size: 0.9rem; }
        .form-group input:focus { border-color: #58a6ff; outline: none; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 0.5rem; font-size: 0.9rem; color: #c9d1d9; font-weight: 600; }

        .btn-row { display: flex; gap: 0.8rem; margin-top: 1rem; }
        .btn { padding: 0.6rem 1.2rem; background: #238636; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #2ea043; }
        .btn-secondary { background: #30363d; color: white; }
        .btn-secondary:hover { background: #484f58; }

        .output-box { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 0.8rem; font-family: monospace; font-size: 0.85rem; color: #7ee787; margin-top: 1rem; display: none; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>DHCP Server Config (dnsmasq)</h2>
    <p class="subtitle">Configure automatic local IP address assignment pools, subnet ranges, and default gateway options.</p>

    <!-- Status Overview -->
    <div class="section">
        <div class="section-title">
            <span>Service Status</span>
            <span id="serviceBadge" class="status-badge status-unknown">Checking Status...</span>
        </div>
        <p id="statusDesc" style="font-size: 0.9rem; color: #8b949e;">Querying system service state...</p>
    </div>

    <!-- Form Section -->
    <div class="section">
        <div class="section-title">DHCP Server Settings</div>

        <div class="checkbox-group" style="margin-bottom: 1.5rem;">
            <input type="checkbox" id="dhcpEnabled">
            <label for="dhcpEnabled">Enable DHCP Service (Automatic IP Allocation)</label>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Network Interface</label>
                <input type="text" id="iface" placeholder="eth0">
            </div>
            <div class="form-group">
                <label>Subnet Netmask</label>
                <input type="text" id="netmask" value="255.255.255.0">
            </div>
            <div class="form-group">
                <label>DHCP IP Start Range</label>
                <input type="text" id="startIp" placeholder="192.168.1.100">
            </div>
            <div class="form-group">
                <label>DHCP IP End Range</label>
                <input type="text" id="endIp" placeholder="192.168.1.200">
            </div>
            <div class="form-group">
                <label>Default Gateway (Router)</label>
                <input type="text" id="gateway" placeholder="192.168.1.1">
            </div>
            <div class="form-group">
                <label>Lease Duration</label>
                <input type="text" id="leaseTime" value="12h">
            </div>
        </div>

        <div class="btn-row">
            <button class="btn" onclick="saveDHCPConfig()">Save Configuration</button>
            <button class="btn btn-secondary" onclick="restartService()">Apply & Restart DHCP Service</button>
            <button class="btn btn-secondary" onclick="checkServiceStatus()">Refresh Status</button>
        </div>
    </div>

    <div id="outputBox" class="output-box"></div>

    <script>
        async function loadDHCPConfig() {
            try {
                const res = await fetch('/api/plugin/data?plugin=dhcp');
                const data = await res.json();

                // Default to disabled (false) unless explicitly saved as true
                document.getElementById('dhcpEnabled').checked = (data.enabled === true);
                document.getElementById('iface').value = data.interface || 'eth0';
                document.getElementById('netmask').value = data.netmask || '255.255.255.0';
                document.getElementById('startIp').value = data.start_ip || '192.168.1.100';
                document.getElementById('endIp').value = data.end_ip || '192.168.1.200';
                document.getElementById('gateway').value = data.gateway || '192.168.1.1';
                document.getElementById('leaseTime').value = data.lease_time || '12h';

                await checkServiceStatus();
            } catch (err) {
                showOutput('Failed to load DHCP settings: ' + err.message);
            }
        }

        async function checkServiceStatus() {
            const badge = document.getElementById('serviceBadge');
            const statusDesc = document.getElementById('statusDesc');

            try {
                const res = await fetch('/api/plugin/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plugin: 'dhcp',
                        cmd_key: 'status_dhcp_cmd',
                        args: {}
                    })
                });

                const data = await res.json();
                const output = data.output || '';

                if (data.success || output.includes('active (running)')) {
                    badge.innerText = 'Service Running';
                    badge.className = 'status-badge status-running';
                    statusDesc.innerText = 'DHCP server (dnsmasq) is currently active and listening for client lease requests.';
                } else {
                    badge.innerText = 'Service Stopped';
                    badge.className = 'status-badge status-stopped';
                    statusDesc.innerText = 'DHCP server (dnsmasq) is currently stopped or inactive.';
                    if (output) {
                        showOutput('DHCP Service Logs / Error output:\n' + output);
                    }
                }
            } catch (err) {
                badge.innerText = 'Status Error';
                badge.className = 'status-badge status-stopped';
                statusDesc.innerText = 'Error querying DHCP status: ' + err.message;
            }
        }

        async function saveDHCPConfig() {
            const config = {
                enabled: document.getElementById('dhcpEnabled').checked,
                interface: document.getElementById('iface').value.trim(),
                netmask: document.getElementById('netmask').value.trim(),
                start_ip: document.getElementById('startIp').value.trim(),
                end_ip: document.getElementById('endIp').value.trim(),
                gateway: document.getElementById('gateway').value.trim(),
                lease_time: document.getElementById('leaseTime').value.trim()
            };

            try {
                const res = await fetch('/api/plugin/data?plugin=dhcp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                const data = await res.json();

                if (data.success) {
                    showOutput(`DHCP configuration saved (Enabled: ${config.enabled}). Click 'Apply & Restart DHCP Service' to activate changes.`);
                } else {
                    showOutput('Failed to save DHCP config.');
                }
            } catch (err) {
                showOutput('Save error: ' + err.message);
            }
        }

        async function restartService() {
            showOutput('Restarting DHCP service...');
            try {
                const res = await fetch('/api/plugin/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plugin: 'dhcp',
                        cmd_key: 'restart_dhcp_sudo',
                        args: {}
                    })
                });

                const data = await res.json();
                if (data.success) {
                    showOutput('DHCP service restarted successfully.\n' + data.output);
                } else {
                    showOutput('Restart error: ' + data.error + '\n' + data.output);
                }
                await checkServiceStatus();
            } catch (err) {
                showOutput('Execution error: ' + err.message);
            }
        }

        function showOutput(text) {
            const box = document.getElementById('outputBox');
            box.style.display = 'block';
            box.innerText = text;
        }

        window.onload = loadDHCPConfig;
    </script>
</body>
</html>
