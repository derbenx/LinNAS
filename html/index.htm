<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debian Server Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background: #0d1117; color: #c9d1d9; overflow: hidden; }

        /* Sidebar Styling */
        #sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .sidebar-header { padding: 1rem 1.2rem; font-size: 1.1rem; font-weight: bold; color: #58a6ff; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .plugin-category { padding: 0.6rem 1rem 0.3rem 1rem; font-size: 0.75rem; text-transform: uppercase; color: #8b949e; letter-spacing: 0.05rem; }
        .nav-list { list-style: none; overflow-y: auto; flex: 1; }
        .nav-item { padding: 0.75rem 1.2rem; cursor: pointer; color: #c9d1d9; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; border-left: 3px solid transparent; transition: all 0.2s; }
        .nav-item:hover { background: #1f242d; color: #fff; }
        .nav-item.active { background: #1f242d; color: #58a6ff; border-left-color: #58a6ff; font-weight: 600; }

        .bright-green-btn { padding: 0.5rem 1rem; background: #238636; color: white; border: 1px solid #2ea043; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.85rem; box-shadow: 0 0 8px rgba(46,160,67,0.4); }
        .bright-green-btn:hover { background: #2ea043; }

        .user-status { padding: 0.8rem; border-top: 1px solid #30363d; font-size: 0.8rem; color: #8b949e; display: flex; justify-content: space-between; align-items: center; background: #0d1117; flex-wrap: wrap; gap: 0.5rem; }
        .logout-btn { color: #f85149; cursor: pointer; border: none; background: none; font-size: 0.8rem; font-weight: bold; }
        .pass-btn { color: #58a6ff; cursor: pointer; border: none; background: none; font-size: 0.8rem; font-weight: bold; display: none; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 90%; max-width: 400px; margin: 15% auto; padding: 1.5rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-weight: bold; color: #58a6ff; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .form-group label { font-size: 0.85rem; color: #8b949e; }
        .form-group input { padding: 0.6rem; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #fff; font-size: 0.9rem; }
        .btn { padding: 0.6rem 1.2rem; background: #238636; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #2ea043; }

        /* Main Content Frame */
        #content-area { flex: 1; display: flex; flex-direction: column; background: #0d1117; }
        #plugin-frame { width: 100%; height: 100%; border: none; }

        .badge-root { background: #238636; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
        .badge-user { background: #d29922; color: black; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <span>Debian Server</span>
            <span id="rootBadge" class="badge-user">User</span>
        </div>
        <div id="navList" class="nav-list"></div>
        <div class="user-status">
            <span id="userInfo">Logged In</span>
            <div>
                <button id="changePassBtn" class="pass-btn" onclick="openPassModal()">🔑 Pass</button>
                <button id="authBtn" class="logout-btn" onclick="toggleAuth()">Logout</button>
            </div>
        </div>

    <!-- Change Password Modal -->
    <div id="passModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Change Account Password</span>
                <button class="pass-btn" style="display:inline;" onclick="closePassModal()">✕</button>
            </div>
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currPass" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPass" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPass" placeholder="••••••••">
            </div>
            <button class="btn" style="width:100%;" onclick="submitPasswordChange()">Save Hash to linnas.data</button>
            <p id="passMsg" style="margin-top:0.8rem; font-size:0.85rem; text-align:center;"></p>
        </div>
    </div>
    </div>

    <div id="content-area">
        <iframe id="plugin-frame" src="/status/index.htm"></iframe>
    </div>

    <script>
        let installedPlugins = [];
        let isLoggedIn = false;

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/status');
                const data = await res.json();
                isLoggedIn = data.logged_in || !data.auth_enabled;

                const badge = document.getElementById('rootBadge');
                const authBtn = document.getElementById('authBtn');
                const userInfo = document.getElementById('userInfo');

                const passBtn = document.getElementById('changePassBtn');
                if (isLoggedIn) {
                    badge.innerText = data.is_root ? 'Root Mode' : 'Sudo / User';
                    badge.className = data.is_root ? 'badge-root' : 'badge-user';
                    userInfo.innerText = 'Authenticated';
                    authBtn.innerText = 'Logout';
                    authBtn.className = 'logout-btn';
                    passBtn.style.display = 'inline';
                } else {
                    badge.innerText = 'Public View';
                    badge.className = 'badge-user';
                    userInfo.innerText = 'Read-Only Mode';
                    authBtn.innerText = '🔑 Login';
                    authBtn.className = 'bright-green-btn';
                    passBtn.style.display = 'none';
                }
            } catch (err) {
                console.error('Auth check error:', err);
            }
        }

        async function loadPlugins() {
            try {
                const res = await fetch('/api/plugins');
                installedPlugins = await res.json();
                renderNavigation();
            } catch (err) {
                console.error('Failed to load plugins:', err);
            }
        }

        window.loadPlugins = loadPlugins;

        window.addEventListener('message', function(event) {
            if (event.data === 'reload_plugins') {
                loadPlugins();
            } else if (typeof event.data === 'string' && event.data.startsWith('open_plugin:')) {
                const pluginId = event.data.split(':')[1];
                openPlugin(pluginId);
            }
        });

        function renderNavigation() {
            const nav = document.getElementById('navList');
            nav.innerHTML = '';

            const activeItem = document.querySelector('.nav-item.active')?.dataset?.id || 'status';

            // Add Default System Status & Overview
            const statusItem = document.createElement('div');
            statusItem.className = `nav-item ${activeItem === 'status' ? 'active' : ''}`;
            statusItem.dataset.id = 'status';
            statusItem.innerHTML = '🖥️ Server Status & Health';
            statusItem.onclick = () => openPlugin('status', statusItem);
            nav.appendChild(statusItem);

            // Group Plugins by Category
            const categories = {};
            installedPlugins.forEach(p => {
                if (p.id === 'status') return; // Handled at top
                if (p.default || p.installed) {
                    const cat = p.category || 'Tools';
                    if (!categories[cat]) categories[cat] = [];
                    categories[cat].push(p);
                }
            });

            for (const [catName, plugins] of Object.entries(categories)) {
                const catHeader = document.createElement('div');
                catHeader.className = 'plugin-category';
                catHeader.innerText = catName;
                nav.appendChild(catHeader);

                plugins.forEach(p => {
                    const item = document.createElement('div');
                    item.className = `nav-item ${activeItem === p.id ? 'active' : ''}`;
                    item.dataset.id = p.id;
                    item.innerHTML = getPluginIcon(p.id) + ' ' + p.name;
                    item.onclick = () => openPlugin(p.id, item);
                    nav.appendChild(item);
                });
            }
        }

        function getPluginIcon(id) {
            const icons = {
                'status': '🖥️',
                'apt': '📦',
                'smb': '📁',
                'veracrypt': '🔒',
                'drive_mount': '💾',
                'dns': '🛡️',
                'dhcp': '🌐',
                'lan': '🔌',
                'wifi': '📶',
                'editor': '📝',
                'ping': '📡',
                'apache': '🌐',
                'mysql': '🗄️',
                'php': '🐘'
            };
            return icons[id] || '⚙️';
        }

        function openPlugin(pluginId, el) {
            if (!isLoggedIn && pluginId !== 'status') {
                window.location.href = '/login.htm';
                return;
            }

            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (!el) {
                el = document.querySelector(`[data-id="${pluginId}"]`);
            }
            if (el) el.classList.add('active');

            const frame = document.getElementById('plugin-frame');
            frame.removeAttribute('srcdoc');
            frame.src = `/${pluginId}/index.htm`;
        }

        async function toggleAuth() {
            if (isLoggedIn) {
                await fetch('/api/logout', { method: 'POST' });
                window.location.reload();
            } else {
                window.location.href = '/login.htm';
            }
        }

        function openPassModal() {
            document.getElementById('passModal').style.display = 'block';
            document.getElementById('passMsg').innerText = '';
        }

        function closePassModal() {
            document.getElementById('passModal').style.display = 'none';
        }

        async function submitPasswordChange() {
            const current_password = document.getElementById('currPass').value;
            const new_password = document.getElementById('newPass').value;
            const confirm_password = document.getElementById('confirmPass').value;
            const msg = document.getElementById('passMsg');

            if (!current_password || !new_password) {
                msg.style.color = '#f85149';
                msg.innerText = 'Please enter both current and new password.';
                return;
            }

            if (new_password !== confirm_password) {
                msg.style.color = '#f85149';
                msg.innerText = 'New password and confirmation do not match.';
                return;
            }

            try {
                const res = await fetch('/api/auth/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password, new_password })
                });
                const data = await res.json();
                if (data.success) {
                    msg.style.color = '#7ee787';
                    msg.innerText = 'Password saved to linnas.data successfully!';
                    setTimeout(closePassModal, 1500);
                } else {
                    msg.style.color = '#f85149';
                    msg.innerText = 'Error: ' + data.error;
                }
            } catch (err) {
                msg.style.color = '#f85149';
                msg.innerText = 'Network error: ' + err.message;
            }
        }

        window.onload = async () => {
            await checkAuth();
            await loadPlugins();
        };
    </script>
</body>
</html>
