<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinNAS</title>
    <script src="/js/crypto.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background: #0d1117; color: #c9d1d9; overflow: hidden; }

        /* Sidebar Styling */
        #sidebar { width: 260px; min-width: 60px; max-width: 500px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; position: relative; }
        #sidebar.is-resizing { transition: none !important; }
        #sidebar.collapsed { width: 60px !important; min-width: 60px !important; }
        #sidebar.collapsed .sidebar-title-text,
        #sidebar.collapsed .plugin-category,
        #sidebar.collapsed .user-status span,
        #sidebar.collapsed .nav-item span.nav-text { display: none !important; }
        #sidebar.collapsed .nav-item { justify-content: center; padding: 0.6rem 0; }
        #sidebar.collapsed .sidebar-header { justify-content: center; padding: 0.8rem 0; }
        #sidebar.collapsed #rootBadge { display: none; }

        .sidebar-header { padding: 1rem 1.2rem; font-size: 1.1rem; font-weight: bold; color: #58a6ff; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; white-space: nowrap; overflow: hidden; }
        .collapse-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px; padding: 0.2rem 0.5rem; cursor: pointer; font-size: 0.75rem; }
        .collapse-btn:hover { background: #30363d; color: #fff; }

        .resizer { width: 6px; background: transparent; position: absolute; right: -3px; top: 0; bottom: 0; cursor: col-resize; z-index: 100; transition: background 0.2s; }
        .resizer:hover, .resizer.resizing { background: #58a6ff; }

        .plugin-category { padding: 0.5rem 1rem 0.15rem 1rem; font-size: 0.72rem; font-weight: bold; text-transform: uppercase; color: #8b949e; letter-spacing: 0.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-list { list-style: none; overflow-y: auto; flex: 1; }
        .nav-item { padding: 0.45rem 1.2rem; cursor: pointer; color: #c9d1d9; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; border-left: 3px solid transparent; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-icon { flex-shrink: 0; font-size: 1.05rem; display: inline-block; }
        .nav-item:hover { background: #1f242d; color: #fff; }
        .nav-item.active { background: #1f242d; color: #58a6ff; border-left-color: #58a6ff; font-weight: 600; }

        .bright-green-btn { padding: 0.5rem 1rem; background: #238636; color: white; border: 1px solid #2ea043; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.85rem; box-shadow: 0 0 8px rgba(46,160,67,0.4); }
        .bright-green-btn:hover { background: #2ea043; }

        .user-status { padding: 0.8rem; border-top: 1px solid #30363d; font-size: 0.8rem; color: #8b949e; display: flex; justify-content: space-between; align-items: center; background: #0d1117; flex-wrap: wrap; gap: 0.5rem; overflow: hidden; }
        .logout-btn { color: #f85149; cursor: pointer; border: none; background: none; font-size: 0.8rem; font-weight: bold; }
        .pass-btn { color: #58a6ff; cursor: pointer; border: none; background: none; font-size: 0.8rem; font-weight: bold; display: none; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 90%; max-width: 400px; margin: 15% auto; padding: 1.5rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-weight: bold; color: #58a6ff; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .form-group label { font-size: 0.85rem; color: #8b949e; }
        .form-group input { padding: 0.6rem; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #fff; font-size: 0.9rem; }
        .btn { padding: 0.6rem 1.2rem; background: #238636; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #2ea043; }

        /* Main Content Frame */
        #content-area { flex: 1; display: flex; flex-direction: column; background: #0d1117; position: relative; }
        #plugin-frame { width: 100%; height: 100%; border: none; }

        /* Global Persistent Audio Player Popup Bar - Separate Floating Top Layer */
        #globalAudioDrawer {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            pointer-events: none;
            transition: left 0.2s, transform 0.25s ease-in-out;
        }

        /* Draggable / Clickable Pull Handle */
        .audio-pull-handle-bar {
            align-self: center;
            background: #161b22;
            border: 1px solid #30363d;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            padding: 0.25rem 1rem;
            cursor: pointer;
            pointer-events: auto;
            color: #58a6ff;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 -3px 10px rgba(0,0,0,0.5);
            user-select: none;
            transition: background 0.2s, color 0.2s;
        }
        .audio-pull-handle-bar:hover {
            background: #21262d;
            color: #79c0ff;
        }

        #globalAudioBar {
            display: flex;
            background: rgba(22, 27, 34, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid #30363d;
            padding: 0.45rem 1rem;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.8);
            flex-wrap: wrap;
            pointer-events: auto;
            transition: max-height 0.25s ease-in-out, opacity 0.25s, padding 0.25s;
            max-height: 120px;
            overflow: hidden;
        }

        #globalAudioDrawer.collapsed-drawer #globalAudioBar {
            max-height: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            border-top: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .global-audio-info { display: flex; align-items: center; gap: 8px; width: 220px; min-width: 180px; max-width: 250px; flex-shrink: 0; }
        .global-audio-title { font-size: 0.85rem; font-weight: bold; color: #58a6ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .global-audio-controls { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; flex-wrap: nowrap; min-width: 0; }
        .global-audio-transport-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; width: 195px; justify-content: flex-start; }
        .global-audio-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px; padding: 0.3rem 0.5rem; cursor: pointer; font-size: 0.8rem; text-align: center; }
        .global-audio-btn:hover { background: #30363d; color: #fff; }
        .global-audio-scrubber { width: 210px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #8b949e; font-family: monospace; }
        .global-audio-scrubber input[type=range] { flex: 1; accent-color: #238636; cursor: pointer; }
        .global-audio-volume { width: 135px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #8b949e; }
        .global-audio-volume input[type=range] { width: 70px; accent-color: #238636; cursor: pointer; }
        .global-audio-output { width: 250px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-size: 0.78rem; justify-content: flex-start; }
        .global-audio-output select { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 0.75rem; padding: 3px 5px; outline: none; }
        .global-audio-extra-btns { display: flex; align-items: center; gap: 6px; width: 105px; flex-shrink: 0; justify-content: flex-end; }

        .badge-root { background: #238636; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
        .badge-user { background: #d29922; color: black; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title-text">LinNAS</span>
            <span id="rootBadge" class="badge-user">User</span>
            <button class="collapse-btn" id="collapseBtn" onclick="toggleSidebarCollapse()" title="Collapse / Expand Sidebar">◀</button>
        </div>
        <div id="navList" class="nav-list"></div>
        <div class="user-status">
            <span id="userInfo">Logged In</span>
            <div>
                <button id="authBtn" class="logout-btn" onclick="toggleAuth()">Logout</button>
            </div>
        </div>
        <div class="resizer" id="sidebarResizer"></div>
    </div>

    <div id="content-area">
        <iframe id="plugin-frame" src="/status/index.htm" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>

        <!-- Persistent Global Audio Popup Drawer (Top Z-layer, Separate from Plugins) -->
        <div id="globalAudioDrawer" class="collapsed-drawer">
            <!-- Pull Handle -->
            <div class="audio-pull-handle-bar" id="audioPullHandle" onclick="toggleGlobalAudioDrawer()" title="Click or pull to open/collapse Pop-up Audio Player">
                <span id="audioPullIcon">▲</span>
                <span>🎵 Audio Player</span>
                <span id="audioPullTrackPreview" style="font-size:0.7rem; color:#8b949e; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-left:4px;"></span>
            </div>

            <!-- Main Audio Bar -->
            <div id="globalAudioBar">
                <div class="global-audio-info">
                    <span id="globalAudioIcon">🎵</span>
                    <span id="globalAudioTitle" class="global-audio-title">No Audio Playing</span>
                </div>
                <div class="global-audio-controls">
                    <div class="global-audio-transport-group">
                        <button class="global-audio-btn" onclick="globalAudioPrev()" title="Previous track">⏮</button>
                        <button id="globalAudioPlayBtn" class="global-audio-btn" onclick="toggleGlobalAudioPlay()">▶</button>
                        <button class="global-audio-btn" onclick="stopGlobalAudio()" title="Stop">⏹</button>
                        <button class="global-audio-btn" onclick="globalAudioNext()" title="Next track">⏭</button>
                        <button id="globalAudioRandBtn" class="global-audio-btn" onclick="toggleGlobalAudioShuffle()" title="Toggle Random/Shuffle">🔀</button>
                        <button id="globalAudioLoopBtn" class="global-audio-btn" onclick="toggleGlobalAudioLoop()" title="Toggle Loop">🔁</button>
                    </div>
                    <div class="global-audio-scrubber">
                        <span id="globalAudioCurrentTime">00:00</span>
                        <input type="range" id="globalAudioSeeker" value="0" min="0" max="100" oninput="seekGlobalAudio(this.value)">
                        <span id="globalAudioDuration">00:00</span>
                    </div>
                    <div class="global-audio-volume">
                        <span>🔊</span>
                        <input type="range" id="globalAudioVolumeSlider" min="0" max="100" value="80" oninput="onGlobalVolumeSlider(this.value)">
                        <span id="globalAudioVolumeVal" style="width:28px; font-family:monospace;">80%</span>
                    </div>
                    <div class="global-audio-output">
                        <select id="globalAudioOutputSelect" style="width: 105px;" onchange="onGlobalAudioOutputChange()">
                            <option value="browser">💻 Browser</option>
                            <option value="http_cast">📡 HTTP Cast</option>
                        </select>
                        <select id="globalAudioRendererSelect" style="display: none; width: 135px;" onchange="onGlobalAudioRendererChange()">
                            <option value="">Scan devices...</option>
                        </select>
                    </div>
                </div>
                <div class="global-audio-extra-btns">
                    <button class="global-audio-btn" onclick="openGlobalAudioPlayerPlugin()" title="Open full Audio Player app">🔊 App</button>
                    <button class="global-audio-btn" style="color: #8b949e;" onclick="collapseGlobalAudioDrawer()" title="Collapse to pull handle">▼</button>
                    <button class="global-audio-btn" style="color: #f85149;" onclick="closeGlobalAudioBar()" title="Stop audio & close">✕</button>
                </div>
            </div>
        </div>
        <audio id="globalAudioPlayer" style="display: none;"></audio>
    </div>

    <!-- Startup Debug Log Popover Modal -->
    <div id="startupIssuesModal" class="modal">
        <div class="modal-content" style="max-width: 680px;">
            <div class="modal-header">
                <span>⚠️ Startup & Autostart Debug Log</span>
                <button class="btn btn-secondary" style="padding: 0.2rem 0.5rem;" onclick="closeStartupIssuesModal()">✕</button>
            </div>
            <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 0.8rem;">
                The following diagnostic events were recorded during server startup / autostart boot:
            </p>
            <textarea id="startupLogTextarea" readonly style="width: 100%; height: 220px; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #7ee787; font-family: monospace; font-size: 0.85rem; padding: 0.8rem; outline: none; margin-bottom: 1rem; resize: vertical;"></textarea>
            <div style="display: flex; gap: 0.8rem; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="clearStartupIssuesLog()">Clear Logs</button>
                <button class="btn" onclick="closeStartupIssuesModal()">Dismiss</button>
            </div>
        </div>
    </div>

    <script>
        let installedPlugins = [];
        let isLoggedIn = false;

        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/status');
                const data = await res.json();
                isLoggedIn = data.logged_in || !data.auth_enabled;

                const badge = document.getElementById('rootBadge');
                const authBtn = document.getElementById('authBtn');
                const userInfo = document.getElementById('userInfo');

                const passBtn = document.getElementById('changePassBtn');
                if (isLoggedIn) {
                    badge.innerText = data.is_root ? 'Root Mode' : 'Sudo / User';
                    badge.className = data.is_root ? 'badge-root' : 'badge-user';
                    userInfo.innerText = 'Authenticated';
                    authBtn.innerText = 'Logout';
                    authBtn.className = 'logout-btn';
                    if (passBtn) passBtn.style.display = 'inline';
                } else {
                    badge.innerText = 'Public View';
                    badge.className = 'badge-user';
                    userInfo.innerText = 'Read-Only Mode';
                    authBtn.innerText = '🔑 Login';
                    authBtn.className = 'bright-green-btn';
                    if (passBtn) passBtn.style.display = 'none';
                }
                renderNavigation();
            } catch (err) {
                console.error('Auth check error:', err);
            }
        }

        async function loadPlugins() {
            try {
                const res = await fetch('/api/plugins');
                installedPlugins = await res.json();
                renderNavigation();
            } catch (err) {
                console.error('Failed to load plugins:', err);
            }
        }

        window.loadPlugins = loadPlugins;

        window.addEventListener('message', function(event) {
            if (event.data === 'reload_plugins') {
                loadPlugins();
            } else if (typeof event.data === 'string' && event.data.startsWith('open_plugin:')) {
                const pluginId = event.data.split(':')[1];
                openPlugin(pluginId);
            } else if (event.data === 'toggle_popup_audio') {
                toggleGlobalAudioDrawer();
            } else if (event.data === 'open_popup_audio') {
                expandGlobalAudioDrawer();
            } else if (event.data === 'close_popup_audio') {
                collapseGlobalAudioDrawer();
            } else if (typeof event.data === 'object' && event.data && event.data.type === 'sync_audio_state') {
                syncAudioStateFromPlugin(event.data);
            }
        });

        function renderNavigation() {
            const nav = document.getElementById('navList');
            nav.innerHTML = '';

            const activeItem = document.querySelector('.nav-item.active')?.dataset?.id || 'status';

            // Add Default System Status & Overview
            const statusItem = document.createElement('div');
            statusItem.className = `nav-item ${activeItem === 'status' ? 'active' : ''}`;
            statusItem.dataset.id = 'status';
            statusItem.title = 'Server Status & Health';
            statusItem.innerHTML = '<span class="nav-icon">🖥️</span> <span class="nav-text">Server Status & Health</span>';
            statusItem.onclick = () => openPlugin('status', statusItem);
            nav.appendChild(statusItem);

            // When logged out, only show the Server Status option in sidebar
            if (!isLoggedIn) {
                return;
            }

            // Group Plugins by Category
            const categories = {};
            installedPlugins.forEach(p => {
                if (p.id === 'status') return; // Handled at top
                if (p.enabled !== false && (p.default || p.installed)) {
                    const cat = p.category || 'Tools';
                    if (!categories[cat]) categories[cat] = [];
                    categories[cat].push(p);
                }
            });

            const categoryOrder = ['System', 'Tools', 'Network', 'Storage'];
            const sortedCategories = Object.keys(categories).sort((a, b) => {
                let idxA = categoryOrder.indexOf(a);
                let idxB = categoryOrder.indexOf(b);
                if (idxA === -1) idxA = 99;
                if (idxB === -1) idxB = 99;
                return idxA - idxB;
            });

            for (const catName of sortedCategories) {
                const plugins = categories[catName];

                if (catName === 'Tools') {
                    // Virtual Desktop first, File Manager second
                    plugins.sort((a, b) => {
                        const order = { 'desktop': 1, 'filemanager': 2 };
                        const orderA = order[a.id] || 99;
                        const orderB = order[b.id] || 99;
                        return orderA - orderB;
                    });
                }

                const catHeader = document.createElement('div');
                catHeader.className = 'plugin-category';
                catHeader.innerText = catName;
                nav.appendChild(catHeader);

                plugins.forEach(p => {
                    const item = document.createElement('div');
                    item.className = `nav-item ${activeItem === p.id ? 'active' : ''}`;
                    item.dataset.id = p.id;
                    item.title = p.name;
                    item.innerHTML = `<span class="nav-icon">${getPluginIcon(p.id)}</span> <span class="nav-text">${p.name}</span>`;
                    item.onclick = () => openPlugin(p.id, item);
                    nav.appendChild(item);
                });
            }
        }

        /* Sidebar Collapse and Resizing Logic */
        let isSidebarCollapsed = false;
        let lastSidebarWidth = 260;

        function toggleSidebarCollapse() {
            const sidebar = document.getElementById('sidebar');
            const collapseBtn = document.getElementById('collapseBtn');
            const drawer = document.getElementById('globalAudioDrawer');
            isSidebarCollapsed = !isSidebarCollapsed;

            if (isSidebarCollapsed) {
                lastSidebarWidth = sidebar.offsetWidth > 100 ? sidebar.offsetWidth : 260;
                sidebar.classList.add('collapsed');
                collapseBtn.innerText = '▶';
                if (drawer) drawer.style.left = '60px';
            } else {
                sidebar.classList.remove('collapsed');
                sidebar.style.width = lastSidebarWidth + 'px';
                collapseBtn.innerText = '◀';
                if (drawer) drawer.style.left = lastSidebarWidth + 'px';
            }
        }

        function initSidebarResizer() {
            const sidebar = document.getElementById('sidebar');
            const resizer = document.getElementById('sidebarResizer');
            const collapseBtn = document.getElementById('collapseBtn');
            const frame = document.getElementById('plugin-frame');
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                e.preventDefault();
                isResizing = true;
                sidebar.classList.add('is-resizing');
                resizer.classList.add('resizing');
                if (frame) frame.style.pointerEvents = 'none';
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                let newWidth = e.clientX;
                if (newWidth < 100) {
                    if (!isSidebarCollapsed) {
                        isSidebarCollapsed = true;
                        sidebar.classList.add('collapsed');
                        collapseBtn.innerText = '▶';
                    }
                    sidebar.style.width = '60px';
                } else if (newWidth <= 500) {
                    if (isSidebarCollapsed) {
                        isSidebarCollapsed = false;
                        sidebar.classList.remove('collapsed');
                        collapseBtn.innerText = '◀';
                    }
                    sidebar.style.width = newWidth + 'px';
                    lastSidebarWidth = newWidth;
                }
                const drawer = document.getElementById('globalAudioDrawer');
                if (drawer) drawer.style.left = sidebar.style.width;
            });

            window.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    sidebar.classList.remove('is-resizing');
                    resizer.classList.remove('resizing');
                    if (frame) frame.style.pointerEvents = 'auto';
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        }

        function getPluginIcon(id) {
            const icons = {
                'status': '🖥️',
                'desktop': '🖥️',
                'apt': '📦',
                'smb': '📁',
                'veracrypt': '🔒',
                'drive_mount': '💾',
                'dns': '🛡️',
                'dhcp': '🌐',
                'lan': '🔌',
                'wifi': '📶',
                'filemanager': '📂',
                'audioplayer': '🎵',
                'imageviewer': '🖼️',
                'videoplayer': '🎬',
                'modelviewer': '🧊',
                'editor': '📝',
                'ping': '📡',
                'apache': '🌐',
                'mysql': '🗄️',
                'php': '🐘',
                'sources': '⚡',
                'drives': '💽',
                'cron': '⏱️',
                'dlna': '📻'
            };
            return icons[id] || '⚙️';
        }

        /* Global Persistent Audio Engine */
        let globalPlaylist = [];
        let globalPlaylistIndex = -1;
        let globalAudioCurrentDir = '';
        let globalAudioShuffle = false;
        let globalAudioLoop = false;
        let globalShuffleOrder = [];

        function ensureGlobalShuffleOrder(forceReshuffle = false) {
            const total = globalPlaylist.length;
            if (total === 0) {
                globalShuffleOrder = [];
                return;
            }
            if (!globalShuffleOrder || globalShuffleOrder.length !== total || forceReshuffle) {
                const arr = Array.from({ length: total }, (_, i) => i);
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                globalShuffleOrder = arr;
            }
        }

        let globalAudioOutput = 'browser';
        let globalAudioVolume = 80;
        let globalAudioDiscoveredRenderers = [];
        let globalAudioRemotePlaying = false;
        let globalAudioPollTimer = null;

        let isGlobalDrawerExpanded = false;

        function toggleGlobalAudioDrawer() {
            if (isGlobalDrawerExpanded) {
                collapseGlobalAudioDrawer();
            } else {
                expandGlobalAudioDrawer();
            }
        }
        window.toggleGlobalAudioDrawer = toggleGlobalAudioDrawer;

        function expandGlobalAudioDrawer() {
            const drawer = document.getElementById('globalAudioDrawer');
            const icon = document.getElementById('audioPullIcon');
            if (drawer) {
                drawer.classList.remove('collapsed-drawer');
                isGlobalDrawerExpanded = true;
                if (icon) icon.innerText = '▼';
            }
        }
        window.expandGlobalAudioDrawer = expandGlobalAudioDrawer;

        function collapseGlobalAudioDrawer() {
            const drawer = document.getElementById('globalAudioDrawer');
            const icon = document.getElementById('audioPullIcon');
            if (drawer) {
                drawer.classList.add('collapsed-drawer');
                isGlobalDrawerExpanded = false;
                if (icon) icon.innerText = '▲';
            }
        }
        window.collapseGlobalAudioDrawer = collapseGlobalAudioDrawer;

        function syncAudioStateToPlugin() {
            const activeTrack = (globalPlaylist && globalPlaylistIndex >= 0 && globalPlaylist[globalPlaylistIndex]) ? globalPlaylist[globalPlaylistIndex] : null;
            const previewEl = document.getElementById('audioPullTrackPreview');
            if (previewEl) {
                previewEl.innerText = activeTrack ? (activeTrack.name || activeTrack.path.split('/').pop()) : '';
            }

            const session = {
                playlist: globalPlaylist,
                currentTrackIndex: globalPlaylistIndex,
                currentDir: globalAudioCurrentDir,
                outputMode: globalAudioOutput,
                volume: globalAudioVolume,
                isShuffle: globalAudioShuffle,
                isLoop: globalAudioLoop,
                isPlaying: (!document.getElementById('globalAudioPlayer').paused || globalAudioRemotePlaying),
                activeRendererId: document.getElementById('globalAudioRendererSelect')?.value || window._globalSavedRendererId || ''
            };
            try {
                localStorage.setItem('linnas_audio_session', JSON.stringify(session));
            } catch (e) {}

            // Post message to iframe if open
            const frame = document.getElementById('plugin-frame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'sync_audio_from_parent', session: session }, '*');
            }
        }

        function syncAudioStateFromPlugin(data) {
            if (!data || !data.session) return;
            const s = data.session;
            if (s.playlist !== undefined) globalPlaylist = s.playlist;
            if (s.currentTrackIndex !== undefined) globalPlaylistIndex = s.currentTrackIndex;
            if (s.currentDir !== undefined) globalAudioCurrentDir = s.currentDir;
            if (s.outputMode !== undefined) {
                globalAudioOutput = s.outputMode;
                const outSel = document.getElementById('globalAudioOutputSelect');
                if (outSel) outSel.value = globalAudioOutput;
                syncGlobalAudioOutputUI();
            }
            if (s.volume !== undefined) {
                setGlobalAudioVolume(s.volume);
            }
            if (s.isShuffle !== undefined) {
                globalAudioShuffle = s.isShuffle;
                const btn = document.getElementById('globalAudioRandBtn');
                if (btn) btn.style.background = globalAudioShuffle ? '#238636' : 'transparent';
            }
            if (s.isLoop !== undefined) {
                globalAudioLoop = s.isLoop;
                const btn = document.getElementById('globalAudioLoopBtn');
                if (btn) btn.style.background = globalAudioLoop ? '#238636' : 'transparent';
            }

            if (globalPlaylist.length > 0 && globalPlaylistIndex >= 0 && globalPlaylistIndex < globalPlaylist.length) {
                const track = globalPlaylist[globalPlaylistIndex];
                const titleEl = document.getElementById('globalAudioTitle');
                if (titleEl) titleEl.innerText = track.name || track.path.split('/').pop();
                const previewEl = document.getElementById('audioPullTrackPreview');
                if (previewEl) previewEl.innerText = track.name || track.path.split('/').pop();
            }

            saveGlobalAudioSettings();
        }

        function loadGlobalAudioSettings() {
            try {
                const raw = localStorage.getItem('linnas_audio_settings');
                if (raw) {
                    const saved = JSON.parse(raw);
                    if (saved.outputMode) globalAudioOutput = saved.outputMode;
                    if (saved.volume !== undefined) globalAudioVolume = parseInt(saved.volume, 10);
                    if (saved.savedRendererId) window._globalSavedRendererId = saved.savedRendererId;
                }

                // Check session
                const sessRaw = localStorage.getItem('linnas_audio_session');
                if (sessRaw) {
                    const sess = JSON.parse(sessRaw);
                    if (sess.playlist && sess.playlist.length > 0) globalPlaylist = sess.playlist;
                    if (sess.currentTrackIndex !== undefined) globalPlaylistIndex = sess.currentTrackIndex;
                    if (sess.currentDir) globalAudioCurrentDir = sess.currentDir;
                    if (sess.isShuffle !== undefined) globalAudioShuffle = sess.isShuffle;
                    if (sess.isLoop !== undefined) globalAudioLoop = sess.isLoop;
                }
            } catch (e) {}

            const outSel = document.getElementById('globalAudioOutputSelect');
            const volSlider = document.getElementById('globalAudioVolumeSlider');
            const volVal = document.getElementById('globalAudioVolumeVal');
            if (outSel) outSel.value = globalAudioOutput;
            if (volSlider) volSlider.value = globalAudioVolume;
            if (volVal) volVal.innerText = `${globalAudioVolume}%`;
            setGlobalAudioVolume(globalAudioVolume);
            syncGlobalAudioOutputUI();

            const randBtn = document.getElementById('globalAudioRandBtn');
            if (randBtn) randBtn.style.background = globalAudioShuffle ? '#238636' : 'transparent';
            const loopBtn = document.getElementById('globalAudioLoopBtn');
            if (loopBtn) loopBtn.style.background = globalAudioLoop ? '#238636' : 'transparent';

            if (globalPlaylist.length > 0 && globalPlaylistIndex >= 0 && globalPlaylistIndex < globalPlaylist.length) {
                const track = globalPlaylist[globalPlaylistIndex];
                const titleEl = document.getElementById('globalAudioTitle');
                if (titleEl) titleEl.innerText = track.name || track.path.split('/').pop();
                const previewEl = document.getElementById('audioPullTrackPreview');
                if (previewEl) previewEl.innerText = track.name || track.path.split('/').pop();
            }
        }

        function saveGlobalAudioSettings() {
            try {
                const rendSel = document.getElementById('globalAudioRendererSelect');
                const saved = {
                    outputMode: globalAudioOutput,
                    volume: globalAudioVolume,
                    savedRendererId: rendSel ? rendSel.value : ''
                };
                localStorage.setItem('linnas_audio_settings', JSON.stringify(saved));
                syncAudioStateToPlugin();
            } catch (e) {}
        }

        function syncGlobalAudioOutputUI() {
            const rendSel = document.getElementById('globalAudioRendererSelect');
            const icon = document.getElementById('globalAudioIcon');
            if (globalAudioOutput === 'http_cast') {
                if (rendSel) rendSel.style.display = 'inline-block';
                if (icon) icon.innerText = '📡';
                refreshGlobalAudioRenderers();
            } else if (globalAudioOutput === 'dlna') {
                if (rendSel) rendSel.style.display = 'inline-block';
                if (icon) icon.innerText = '📻';
                refreshGlobalAudioRenderers();
            } else {
                if (rendSel) rendSel.style.display = 'none';
                if (icon) icon.innerText = '🎵';
            }
        }

        function onGlobalAudioOutputChange() {
            const outSel = document.getElementById('globalAudioOutputSelect');
            globalAudioOutput = outSel.value;
            saveGlobalAudioSettings();
            syncGlobalAudioOutputUI();

            if (globalAudioOutput === 'dlna' || globalAudioOutput === 'http_cast') {
                const player = document.getElementById('globalAudioPlayer');
                player.pause();
                if (globalPlaylist.length > 0 && globalPlaylistIndex >= 0) {
                    castGlobalTrackToDLNA(globalPlaylist[globalPlaylistIndex]);
                }
            } else {
                stopGlobalAudioRemote();
                loadAndPlayGlobalTrack();
            }
        }

        function onGlobalAudioRendererChange() {
            saveGlobalAudioSettings();
            if ((globalAudioOutput === 'dlna' || globalAudioOutput === 'http_cast') && globalPlaylist.length > 0 && globalPlaylistIndex >= 0) {
                castGlobalTrackToDLNA(globalPlaylist[globalPlaylistIndex]);
            }
        }

        async function refreshGlobalAudioRenderers() {
            const rendSel = document.getElementById('globalAudioRendererSelect');
            if (!rendSel) return;
            rendSel.innerHTML = '<option value="">Scanning...</option>';
            try {
                const res = await fetch('/api/dlna/renderers');
                const data = await res.json();
                globalAudioDiscoveredRenderers = data.renderers || [];
                rendSel.innerHTML = '';
                if (globalAudioDiscoveredRenderers.length === 0) {
                    rendSel.innerHTML = '<option value="">No devices found</option>';
                    return;
                }
                globalAudioDiscoveredRenderers.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.innerText = r.friendly_name || r.ip;
                    rendSel.appendChild(opt);
                });
                if (window._globalSavedRendererId) {
                    const match = globalAudioDiscoveredRenderers.find(r => r.id === window._globalSavedRendererId || r.ip === window._globalSavedRendererId);
                    if (match) rendSel.value = match.id;
                }
            } catch (e) {
                rendSel.innerHTML = '<option value="">Scan failed</option>';
            }
        }

        function onGlobalVolumeSlider(val) {
            setGlobalAudioVolume(parseInt(val, 10));
            saveGlobalAudioSettings();
        }

        function setGlobalAudioVolume(vol) {
            globalAudioVolume = vol;
            const slider = document.getElementById('globalAudioVolumeSlider');
            const valEl = document.getElementById('globalAudioVolumeVal');
            if (slider) slider.value = vol;
            if (valEl) valEl.innerText = `${vol}%`;

            const player = document.getElementById('globalAudioPlayer');
            if (player) player.volume = vol / 100;

            if (globalAudioOutput === 'dlna' || globalAudioOutput === 'http_cast') {
                const rendSel = document.getElementById('globalAudioRendererSelect');
                const rendererId = rendSel ? rendSel.value : '';
                if (rendererId) {
                    fetch('/api/dlna/cast', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ renderer_id: rendererId, action: 'volume', volume: vol })
                    }).catch(() => {});
                }
            }
        }
        window.setGlobalAudioVolume = setGlobalAudioVolume;

        function playGlobalAudioQueue(playlist, startIndex, dirPath) {
            if (!playlist || playlist.length === 0) return;
            globalPlaylist = playlist;
            globalPlaylistIndex = startIndex || 0;
            if (dirPath) globalAudioCurrentDir = dirPath;
            if (globalAudioShuffle) ensureGlobalShuffleOrder(true);
            loadGlobalAudioSettings();
            expandGlobalAudioDrawer();

            if (globalAudioOutput === 'dlna' || globalAudioOutput === 'http_cast') {
                const track = globalPlaylist[globalPlaylistIndex];
                const titleEl = document.getElementById('globalAudioTitle');
                if (titleEl) titleEl.innerText = track.name || track.path.split('/').pop();
                syncAudioStateToPlugin();
                castGlobalTrackToDLNA(track);
            } else {
                loadAndPlayGlobalTrack();
            }
        }

        window.playGlobalAudioQueue = playGlobalAudioQueue;

        function loadAndPlayGlobalTrack() {
            if (globalPlaylistIndex < 0 || globalPlaylistIndex >= globalPlaylist.length) return;
            const track = globalPlaylist[globalPlaylistIndex];
            const player = document.getElementById('globalAudioPlayer');
            const titleEl = document.getElementById('globalAudioTitle');

            player.src = `/api/fs/raw?path=${encodeURIComponent(track.path)}`;
            if (titleEl) titleEl.innerText = track.name || track.path.split('/').pop();
            expandGlobalAudioDrawer();
            syncAudioStateToPlugin();

            player.play().then(() => {
                document.getElementById('globalAudioPlayBtn').innerText = '⏸';
                syncAudioStateToPlugin();
            }).catch(() => {
                document.getElementById('globalAudioPlayBtn').innerText = '▶';
                syncAudioStateToPlugin();
            });
        }

        async function castGlobalTrackToDLNA(track) {
            const rendSel = document.getElementById('globalAudioRendererSelect');
            const rendererId = rendSel ? rendSel.value : '';
            if (!rendererId) {
                await refreshGlobalAudioRenderers();
            }
            const activeId = rendSel ? rendSel.value : '';
            if (!activeId) return;

            const streamMode = (globalAudioOutput === 'http_cast') ? 'direct_http' : 'dlna_content';
            try {
                const res = await fetch('/api/dlna/cast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        renderer_id: activeId,
                        action: 'play',
                        file_path: track.path,
                        stream_mode: streamMode
                    })
                });
                const data = await res.json();
                if (data.success) {
                    globalAudioRemotePlaying = true;
                    document.getElementById('globalAudioPlayBtn').innerText = '⏸';
                    startGlobalAudioPolling(activeId);
                    setGlobalAudioVolume(globalAudioVolume);
                }
            } catch (e) {}
        }

        function startGlobalAudioPolling(rendererId) {
            if (globalAudioPollTimer) clearInterval(globalAudioPollTimer);
            globalAudioPollTimer = setInterval(async () => {
                if (globalAudioOutput !== 'dlna' && globalAudioOutput !== 'http_cast') return;
                try {
                    const res = await fetch(`/api/dlna/cast/status?renderer_id=${encodeURIComponent(rendererId)}`);
                    const data = await res.json();
                    if (data.success) {
                        if (data.state === 'STOPPED' && globalAudioRemotePlaying) {
                            globalAudioNext(true);
                        } else if (data.state === 'PLAYING') {
                            globalAudioRemotePlaying = true;
                            document.getElementById('globalAudioPlayBtn').innerText = '⏸';
                            if (data.rel_time) document.getElementById('globalAudioCurrentTime').innerText = data.rel_time;
                            if (data.track_duration) document.getElementById('globalAudioDuration').innerText = data.track_duration;
                        } else if (data.state === 'PAUSED_PLAYBACK') {
                            globalAudioRemotePlaying = false;
                            document.getElementById('globalAudioPlayBtn').innerText = '▶';
                        }
                    }
                } catch (e) {}
            }, 3000);
        }

        function stopGlobalAudioRemote() {
            const rendSel = document.getElementById('globalAudioRendererSelect');
            const rendererId = rendSel ? rendSel.value : '';
            if (rendererId) {
                fetch('/api/dlna/cast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ renderer_id: rendererId, action: 'stop' })
                }).catch(() => {});
            }
            globalAudioRemotePlaying = false;
            if (globalAudioPollTimer) clearInterval(globalAudioPollTimer);
        }

        function toggleGlobalAudioShuffle() {
            globalAudioShuffle = !globalAudioShuffle;
            if (globalAudioShuffle) ensureGlobalShuffleOrder(true);
            const btn = document.getElementById('globalAudioRandBtn');
            if (btn) btn.style.background = globalAudioShuffle ? '#238636' : 'transparent';
        }

        function toggleGlobalAudioLoop() {
            globalAudioLoop = !globalAudioLoop;
            const btn = document.getElementById('globalAudioLoopBtn');
            if (btn) btn.style.background = globalAudioLoop ? '#238636' : 'transparent';
        }

        function toggleGlobalAudioPlay() {
            if (globalPlaylist.length === 0) return;
            if (globalPlaylistIndex < 0) {
                playSelectedGlobalIndex(0);
                return;
            }

            const player = document.getElementById('globalAudioPlayer');
            const btn = document.getElementById('globalAudioPlayBtn');

            if (globalAudioOutput === 'dlna' || globalAudioOutput === 'http_cast') {
                const rendSel = document.getElementById('globalAudioRendererSelect');
                const rendererId = rendSel ? rendSel.value : '';
                if (!rendererId) return;

                const action = globalAudioRemotePlaying ? 'pause' : 'play';
                fetch('/api/dlna/cast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ renderer_id: rendererId, action: action })
                }).then(r => r.json()).then(data => {
                    if (data.success) {
                        globalAudioRemotePlaying = !globalAudioRemotePlaying;
                        btn.innerText = globalAudioRemotePlaying ? '⏸' : '▶';
                        syncAudioStateToPlugin();
                    }
                }).catch(() => {});
            } else {
                if (player.paused) {
                    // Resume exact track
                    const track = globalPlaylist[globalPlaylistIndex];
                    if (track && (!player.src || !player.src.includes(encodeURIComponent(track.path)))) {
                        loadAndPlayGlobalTrack();
                        return;
                    }
                    player.play().then(() => {
                        btn.innerText = '⏸';
                        syncAudioStateToPlugin();
                    }).catch(() => {});
                } else {
                    player.pause();
                    btn.innerText = '▶';
                    syncAudioStateToPlugin();
                }
            }
        }

        function stopGlobalAudio() {
            const player = document.getElementById('globalAudioPlayer');
            player.pause();
            stopGlobalAudioRemote();
            document.getElementById('globalAudioPlayBtn').innerText = '▶';
            syncAudioStateToPlugin();
        }

        function playSelectedGlobalIndex(idx) {
            globalPlaylistIndex = idx;
            if (globalPlaylistIndex < 0 || globalPlaylistIndex >= globalPlaylist.length) return;
            const track = globalPlaylist[globalPlaylistIndex];
            const titleEl = document.getElementById('globalAudioTitle');
            if (titleEl) titleEl.innerText = track.name || track.path.split('/').pop();
            const previewEl = document.getElementById('audioPullTrackPreview');
            if (previewEl) previewEl.innerText = track.name || track.path.split('/').pop();

            syncAudioStateToPlugin();

            if (globalAudioOutput === 'http_cast' || globalAudioOutput === 'dlna') {
                const player = document.getElementById('globalAudioPlayer');
                player.pause();
                castGlobalTrackToDLNA(track);
            } else {
                loadAndPlayGlobalTrack();
            }
        }

        function globalAudioPrev() {
            if (globalPlaylist.length === 0) return;
            const total = globalPlaylist.length;
            let targetIdx = 0;
            if (globalAudioShuffle) {
                ensureGlobalShuffleOrder();
                const pos = globalShuffleOrder.indexOf(globalPlaylistIndex);
                const prevPos = pos - 1;
                targetIdx = prevPos < 0 ? globalShuffleOrder[total - 1] : globalShuffleOrder[prevPos];
            } else {
                targetIdx = (globalPlaylistIndex - 1 + total) % total;
            }
            playSelectedGlobalIndex(targetIdx);
        }

        function globalAudioNext(fromEnd = false) {
            if (globalPlaylist.length === 0) return;
            const total = globalPlaylist.length;
            if (globalAudioShuffle) {
                ensureGlobalShuffleOrder();
                const pos = globalShuffleOrder.indexOf(globalPlaylistIndex);
                const nextPos = pos + 1;
                if (nextPos >= total) {
                    if (globalAudioLoop) {
                        ensureGlobalShuffleOrder(true);
                        playSelectedGlobalIndex(globalShuffleOrder[0]);
                    } else if (!fromEnd) {
                        playSelectedGlobalIndex(globalShuffleOrder[0]);
                    }
                    return;
                }
                playSelectedGlobalIndex(globalShuffleOrder[nextPos]);
            } else {
                const nextIdx = globalPlaylistIndex + 1;
                if (nextIdx >= total) {
                    if (globalAudioLoop) {
                        playSelectedGlobalIndex(0);
                    } else if (!fromEnd) {
                        playSelectedGlobalIndex(0);
                    }
                    return;
                }
                playSelectedGlobalIndex(nextIdx);
            }
        }

        function seekGlobalAudio(val) {
            const player = document.getElementById('globalAudioPlayer');
            if (player.duration) {
                player.currentTime = (val / 100) * player.duration;
            }
        }

        function openGlobalAudioPlayerPlugin() {
            loadPluginView('audioplayer', { dir: globalAudioCurrentDir });
        }

        let isGlobalAudioBarMinimized = false;

        function toggleMinimizeGlobalAudioBar() {
            const bar = document.getElementById('globalAudioBar');
            const restoreBox = document.getElementById('globalAudioMinRestore');
            isGlobalAudioBarMinimized = !isGlobalAudioBarMinimized;
            if (isGlobalAudioBarMinimized) {
                bar.classList.add('minimized-bar');
                if (restoreBox) restoreBox.style.display = 'flex';
            } else {
                bar.classList.remove('minimized-bar');
                if (restoreBox) restoreBox.style.display = 'none';
            }
        }

        function closeGlobalAudioBar() {
            const player = document.getElementById('globalAudioPlayer');
            player.pause();
            stopGlobalAudioRemote();
            document.getElementById('globalAudioPlayBtn').innerText = '▶';
            collapseGlobalAudioDrawer();
        }
        window.closeGlobalAudioBar = closeGlobalAudioBar;

        document.getElementById('globalAudioPlayer').addEventListener('timeupdate', function() {
            const player = document.getElementById('globalAudioPlayer');
            if (player.duration) {
                const seeker = document.getElementById('globalAudioSeeker');
                seeker.value = (player.currentTime / player.duration) * 100;
                document.getElementById('globalAudioCurrentTime').innerText = formatAudioTime(player.currentTime);
                document.getElementById('globalAudioDuration').innerText = formatAudioTime(player.duration);
            }
        });

        document.getElementById('globalAudioPlayer').addEventListener('ended', function() {
            globalAudioNext(true);
        });

        function formatAudioTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return '00:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        const lastPluginState = {
            filemanager: '',
            editor: '',
            audioplayer: '',
            imageviewer: '',
            videoplayer: '',
            modelviewer: ''
        };

        function loadPluginView(pluginId, params) {
            let basePluginId = pluginId;
            let queryParts = [];

            if (params) {
                for (const [k, v] of Object.entries(params)) {
                    if (v) queryParts.push(`${encodeURIComponent(k)}=${encodeURIComponent(v)}`);
                }
            }

            let queryStr = queryParts.length > 0 ? '?' + queryParts.join('&') : '';
            openPlugin(basePluginId + queryStr);
        }

        window.loadPluginView = loadPluginView;

        function openPlugin(pluginIdStr, el) {
            let basePluginId = pluginIdStr;
            let queryStr = '';
            if (pluginIdStr.includes('?')) {
                const parts = pluginIdStr.split('?');
                basePluginId = parts[0];
                queryStr = '?' + parts[1];
            }

            if (!isLoggedIn && basePluginId !== 'status') {
                window.location.href = '/login.htm';
                return;
            }

            // Restore/save memory for File Manager, File Editor, Audio Player, Image Viewer, Video Player, Model Viewer
            if (['filemanager', 'editor', 'audioplayer', 'imageviewer', 'videoplayer', 'modelviewer'].includes(basePluginId)) {
                if (queryStr) {
                    lastPluginState[basePluginId] = queryStr;
                } else if (lastPluginState[basePluginId]) {
                    queryStr = lastPluginState[basePluginId];
                }
            }

            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (!el) {
                el = document.querySelector(`[data-id="${basePluginId}"]`);
            }
            if (el) el.classList.add('active');

            const frame = document.getElementById('plugin-frame');
            frame.removeAttribute('srcdoc');
            frame.src = `/${basePluginId}/index.htm${queryStr}`;
        }

        async function toggleAuth() {
            if (isLoggedIn) {
                await fetch('/api/logout', { method: 'POST' });
                window.location.reload();
            } else {
                window.location.href = '/login.htm';
            }
        }

        function openPassModal() {
            document.getElementById('passModal').style.display = 'block';
            document.getElementById('passMsg').innerText = '';
        }

        function closePassModal() {
            document.getElementById('passModal').style.display = 'none';
        }

        async function submitPasswordChange() {
            const current_password = document.getElementById('currPass').value;
            const new_password = document.getElementById('newPass').value;
            const confirm_password = document.getElementById('confirmPass').value;
            const msg = document.getElementById('passMsg');

            if (!current_password || !new_password) {
                msg.style.color = '#f85149';
                msg.innerText = 'Please enter both current and new password.';
                return;
            }

            if (new_password !== confirm_password) {
                msg.style.color = '#f85149';
                msg.innerText = 'New password and confirmation do not match.';
                return;
            }

            try {
                const encBody = await encryptPayload({ current_password, new_password });
                const res = await fetch('/api/auth/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: encBody
                });
                const data = await res.json();
                if (data.success) {
                    msg.style.color = '#7ee787';
                    msg.innerText = 'Password saved to linnas.data successfully!';
                    setTimeout(closePassModal, 1500);
                } else {
                    msg.style.color = '#f85149';
                    msg.innerText = 'Error: ' + data.error;
                }
            } catch (err) {
                msg.style.color = '#f85149';
                msg.innerText = 'Network error: ' + err.message;
            }
        }

        async function checkStartupIssues() {
            try {
                const res = await fetch('/api/startup/issues');
                const data = await res.json();
                if (data.has_issues && data.debug_enabled && data.log) {
                    document.getElementById('startupLogTextarea').value = data.log;
                    document.getElementById('startupIssuesModal').style.display = 'block';
                }
            } catch (err) {
                console.error('Failed to check startup issues:', err);
            }
        }

        function closeStartupIssuesModal() {
            document.getElementById('startupIssuesModal').style.display = 'none';
        }

        async function clearStartupIssuesLog() {
            try {
                await fetch('/api/startup/clear', { method: 'POST' });
                closeStartupIssuesModal();
            } catch (err) {}
        }

        window.onload = async () => {
            initSidebarResizer();
            loadGlobalAudioSettings();
            await checkAuth();
            await loadPlugins();
            if (isLoggedIn) {
                await checkStartupIssues();
            }
        };
    </script>
</body>
</html>
