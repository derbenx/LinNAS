<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMB Shares Config</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; padding: 2rem; }
        h2 { font-size: 1.5rem; color: #58a6ff; margin-bottom: 0.5rem; }
        p.subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.9rem; }

        .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section-title { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; margin-bottom: 1rem; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.85rem; color: #8b949e; }
        .form-group input, .form-group select { padding: 0.6rem; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #fff; font-size: 0.9rem; }
        .form-group input:focus { border-color: #58a6ff; outline: none; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 0.5rem; font-size: 0.9rem; color: #c9d1d9; }

        .btn { padding: 0.6rem 1.2rem; background: #238636; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; width: fit-content; }
        .btn:hover { background: #2ea043; }
        .btn-danger { background: #da3633; }
        .btn-danger:hover { background: #b62324; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #30363d; }
        th { color: #8b949e; font-weight: 600; background: #1f242d; }

        .output-box { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 0.8rem; font-family: monospace; font-size: 0.85rem; color: #7ee787; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
    <h2>SMB Network Shares Config</h2>
    <p class="subtitle">Manage Samba shares and network file permissions across your LAN.</p>

    <!-- Create Share Form -->
    <div class="section">
        <div class="section-title">Add New Network Share</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Share Name</label>
                <input type="text" id="shareName" placeholder="PublicData">
            </div>
            <div class="form-group">
                <label>Directory Path</label>
                <input type="text" id="sharePath" placeholder="/mnt/data/public">
            </div>
            <div class="form-group">
                <label>Comment / Description</label>
                <input type="text" id="shareComment" placeholder="Public network share">
            </div>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="readOnly">
            <label for="readOnly">Read-Only access (Guest Write Disabled)</label>
        </div>
        <br>
        <button class="btn" onclick="addShare()">Add Share</button>
    </div>

    <!-- Active Shares List -->
    <div class="section">
        <div class="section-title">Configured SMB Shares</div>
        <button class="btn" style="background: #30363d; margin-bottom: 1rem;" onclick="restartSMBService()">Restart Samba Service</button>
        <table>
            <thead>
                <tr>
                    <th>Share Name</th>
                    <th>Path</th>
                    <th>Comment</th>
                    <th>Read-Only</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="smbTableBody">
                <tr><td colspan="5" style="text-align: center; color: #8b949e;">Loading shares...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="outputBox" class="output-box"></div>

    <script>
        let shares = [];

        async function loadSMBData() {
            try {
                const res = await fetch('/api/plugin/data?plugin=smb');
                const data = await res.json();
                shares = data.shares || [];
                renderShares();
            } catch (err) {
                showOutput('Failed to load SMB data: ' + err.message);
            }
        }

        function renderShares() {
            const tbody = document.getElementById('smbTableBody');
            tbody.innerHTML = '';

            if (shares.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #8b949e;">No SMB shares configured yet.</td></tr>';
                return;
            }

            shares.forEach((s, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${s.name}</strong></td>
                    <td>${s.path}</td>
                    <td>${s.comment || '-'}</td>
                    <td>${s.read_only ? 'Yes' : 'No'}</td>
                    <td>
                        <button class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="deleteShare(${idx})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function saveSMBData() {
            try {
                await fetch('/api/plugin/data?plugin=smb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shares: shares })
                });
                renderShares();
            } catch (err) {
                showOutput('Failed to save SMB configuration: ' + err.message);
            }
        }

        async function addShare() {
            const name = document.getElementById('shareName').value.trim();
            const path = document.getElementById('sharePath').value.trim();
            const comment = document.getElementById('shareComment').value.trim();
            const readOnly = document.getElementById('readOnly').checked;

            if (!name || !path) {
                showOutput('Please enter both Share Name and Path.');
                return;
            }

            // Conflict check
            if (shares.some(s => s.name.toLowerCase() === name.toLowerCase())) {
                showOutput(`Share with name '${name}' already exists.`);
                return;
            }

            shares.push({ name, path, comment, read_only: readOnly });
            await saveSMBData();

            document.getElementById('shareName').value = '';
            document.getElementById('sharePath').value = '';
            document.getElementById('shareComment').value = '';
            document.getElementById('readOnly').checked = false;

            showOutput(`Added SMB share '${name}'. Click "Restart Samba Service" to apply changes.`);
        }

        async function deleteShare(index) {
            const removed = shares.splice(index, 1);
            await saveSMBData();
            showOutput(`Removed SMB share '${removed[0].name}'. Click "Restart Samba Service" to apply changes.`);
        }

        async function restartSMBService() {
            showOutput('Restarting Samba daemon service...');
            try {
                const res = await fetch('/api/plugin/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plugin: 'smb',
                        cmd_key: 'restart_smb_cmd',
                        args: {}
                    })
                });
                const data = await res.json();
                if (data.success) {
                    showOutput('Samba service restarted successfully.\n' + data.output);
                } else {
                    showOutput('Service restart failed: ' + data.error + '\n' + data.output);
                }
            } catch (err) {
                showOutput('Failed to execute restart: ' + err.message);
            }
        }

        function showOutput(text) {
            const box = document.getElementById('outputBox');
            box.style.display = 'block';
            box.innerText = text;
        }

        window.onload = loadSMBData;
    </script>
</body>
</html>
