<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Viewer - LinNAS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; padding: 1.5rem; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 0.8rem 1.2rem; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.8rem; }
        .title-group { display: flex; align-items: center; gap: 10px; }
        h2 { font-size: 1.3rem; color: #58a6ff; }
        .meta-info { font-size: 0.85rem; color: #8b949e; font-family: monospace; }

        .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .btn { padding: 0.45rem 0.9rem; background: #238636; color: white; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 0.82rem; transition: background 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
        .btn-secondary:hover { background: #30363d; color: white; }
        .btn:disabled { background: #30363d; color: #6e7681; cursor: not-allowed; border: none; }

        .viewer-stage { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: auto; padding: 1rem; }
        .viewer-image { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 4px; transition: transform 0.2s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }

        .empty-placeholder { text-align: center; color: #8b949e; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        .empty-icon { font-size: 3.5rem; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 80%; max-width: 650px; margin: 10% auto; padding: 1.5rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-weight: bold; color: #58a6ff; }
        .file-list { max-height: 300px; overflow-y: auto; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 0.5rem; }
        .file-item { padding: 0.5rem; cursor: pointer; border-bottom: 1px solid #21262d; font-family: monospace; font-size: 0.88rem; }
        .file-item:hover { background: #1f242d; color: #58a6ff; }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="title-group">
            <button id="backBtn" class="btn btn-secondary" style="display: none;" onclick="goBackToFiles()">⬅ Back to Files</button>
            <div>
                <h2>🖼️ Image Viewer</h2>
                <div id="imageMeta" class="meta-info">No image loaded</div>
            </div>
        </div>
        <div class="toolbar">
            <button class="btn btn-secondary" onclick="openFilePicker()">📂 Browse Image...</button>
            <button id="prevBtn" class="btn btn-secondary" onclick="navigateImage(-1)" disabled>◀ Previous</button>
            <button id="nextBtn" class="btn btn-secondary" onclick="navigateImage(1)" disabled>Next ▶</button>
            <button class="btn btn-secondary" onclick="adjustZoom(1.2)">🔍+</button>
            <button class="btn btn-secondary" onclick="adjustZoom(0.8)">🔍-</button>
            <button class="btn btn-secondary" onclick="resetZoom()">🔄 Reset</button>
        </div>
    </div>

    <div class="viewer-stage" id="viewerStage">
        <div id="emptyView" class="empty-placeholder">
            <div class="empty-icon">🖼️</div>
            <p>No image currently selected.</p>
            <button class="btn" onclick="openFilePicker()">Select Image File</button>
        </div>
        <img id="mainImage" class="viewer-image" style="display: none;" alt="Preview">
    </div>

    <!-- Image File Picker Modal -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalPath">/</span>
                <button class="btn btn-secondary" style="padding: 0.2rem 0.5rem;" onclick="closeModal()">✕</button>
            </div>
            <div id="fileList" class="file-list"></div>
        </div>
    </div>

    <script>
        let currentFilePath = null;
        let currentDir = null;
        let directoryImages = [];
        let currentImageIndex = -1;
        let currentZoom = 1;

        async function initViewer() {
            const urlParams = new URLSearchParams(window.location.search);
            const file = urlParams.get('file');
            const dir = urlParams.get('dir');

            if (dir) {
                currentDir = dir;
                document.getElementById('backBtn').style.display = 'flex';
                await loadDirectoryImages(dir);
            }

            if (file) {
                loadImage(file);
            }
        }

        async function loadDirectoryImages(dirPath) {
            try {
                const res = await fetch(`/api/fs/browse?path=${encodeURIComponent(dirPath)}`);
                const data = await res.json();
                if (data.items) {
                    directoryImages = data.items.filter(item => !item.is_dir && isImageFile(item.name)).map(item => item.path);
                    updateNavButtons();
                }
            } catch (err) {
                console.error('Failed to load sibling images:', err);
            }
        }

        function loadImage(filePath) {
            currentFilePath = filePath;
            currentZoom = 1;

            const imgEl = document.getElementById('mainImage');
            const emptyView = document.getElementById('emptyView');
            const metaEl = document.getElementById('imageMeta');

            imgEl.style.transform = 'scale(1)';
            imgEl.src = `/api/fs/raw?path=${encodeURIComponent(filePath)}`;
            imgEl.style.display = 'block';
            emptyView.style.display = 'none';

            const filename = filePath.split('/').pop();
            metaEl.innerText = `${filename} (${filePath})`;

            imgEl.onload = function() {
                metaEl.innerText = `${filename} | ${imgEl.naturalWidth} × ${imgEl.naturalHeight} px | ${filePath}`;
            };

            imgEl.onerror = function() {
                metaEl.innerText = `Failed to load image: ${filename}`;
            };

            if (directoryImages.length > 0) {
                currentImageIndex = directoryImages.indexOf(filePath);
                updateNavButtons();
            }
        }

        function navigateImage(delta) {
            if (directoryImages.length === 0 || currentImageIndex === -1) return;

            let newIndex = currentImageIndex + delta;
            if (newIndex < 0) newIndex = directoryImages.length - 1;
            if (newIndex >= directoryImages.length) newIndex = 0;

            loadImage(directoryImages[newIndex]);
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const hasMultiple = directoryImages.length > 1;

            prevBtn.disabled = !hasMultiple;
            nextBtn.disabled = !hasMultiple;
        }

        function goBackToFiles() {
            if (window.parent) {
                window.parent.postMessage(`open_plugin:filemanager?dir=${encodeURIComponent(currentDir || '/')}`, '*');
            }
            window.location.href = `/filemanager/index.htm?dir=${encodeURIComponent(currentDir || '/')}`;
        }

        function adjustZoom(factor) {
            currentZoom *= factor;
            if (currentZoom < 0.2) currentZoom = 0.2;
            if (currentZoom > 5) currentZoom = 5;
            document.getElementById('mainImage').style.transform = `scale(${currentZoom})`;
        }

        function resetZoom() {
            currentZoom = 1;
            document.getElementById('mainImage').style.transform = 'scale(1)';
        }

        /* File Picker Modal */
        let currentBrowserPath = '/';

        async function openFilePicker(path) {
            currentBrowserPath = path || currentDir || '/';
            document.getElementById('modalPath').innerText = currentBrowserPath;
            document.getElementById('fileModal').style.display = 'block';

            try {
                const res = await fetch(`/api/fs/browse?path=${encodeURIComponent(currentBrowserPath)}`);
                const data = await res.json();
                const container = document.getElementById('fileList');
                container.innerHTML = '';

                if (data.parent && data.parent !== currentBrowserPath) {
                    const upDiv = document.createElement('div');
                    upDiv.className = 'file-item';
                    upDiv.innerText = '📁 .. (Parent Directory)';
                    upDiv.onclick = () => openFilePicker(data.parent);
                    container.appendChild(upDiv);
                }

                if (data.items) {
                    data.items.forEach(item => {
                        if (item.is_dir || isImageFile(item.name)) {
                            const itemDiv = document.createElement('div');
                            itemDiv.className = 'file-item';
                            itemDiv.innerText = (item.is_dir ? '📁 ' : '🖼️ ') + item.name;
                            itemDiv.onclick = () => {
                                if (item.is_dir) {
                                    openFilePicker(item.path);
                                } else {
                                    closeModal();
                                    currentDir = currentBrowserPath;
                                    loadDirectoryImages(currentDir).then(() => loadImage(item.path));
                                }
                            };
                            container.appendChild(itemDiv);
                        }
                    });
                }
            } catch (err) {
                console.error('Picker error:', err);
            }
        }

        function closeModal() {
            document.getElementById('fileModal').style.display = 'none';
        }

        function isImageFile(filename) {
            if (!filename || !filename.includes('.')) return false;
            const ext = filename.split('.').pop().toLowerCase();
            return ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'bmp', 'ico'].includes(ext);
        }

        window.onload = initViewer;
    </script>
</body>
</html>
