<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VeraCrypt / TrueCrypt Config (tcplay)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; padding: 2rem; }
        h2 { font-size: 1.5rem; color: #58a6ff; margin-bottom: 0.5rem; }
        p.subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.9rem; }

        .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .section-title { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; margin-bottom: 1rem; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.85rem; color: #8b949e; }
        .form-group input { padding: 0.6rem; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #fff; font-size: 0.9rem; }
        .form-group input:focus { border-color: #58a6ff; outline: none; }

        .path-input-group { display: flex; gap: 0.5rem; }
        .path-input-group input { flex: 1; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 0.5rem; font-size: 0.9rem; color: #c9d1d9; }

        .btn { padding: 0.6rem 1.2rem; background: #238636; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #2ea043; }
        .btn-secondary { background: #30363d; color: white; }
        .btn-secondary:hover { background: #484f58; }
        .btn-danger { background: #da3633; color: white; }
        .btn-danger:hover { background: #b62324; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #30363d; }
        th { color: #8b949e; font-weight: 600; background: #1f242d; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 80%; max-width: 650px; margin: 10% auto; padding: 1.5rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-weight: bold; color: #58a6ff; }
        .modal-actions { display: flex; gap: 0.5rem; align-items: center; }
        .file-list { max-height: 300px; overflow-y: auto; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 0.5rem; }
        .file-item { padding: 0.5rem; cursor: pointer; border-bottom: 1px solid #21262d; font-family: monospace; }
        .file-item:hover { background: #1f242d; color: #58a6ff; }

        .output-box { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 0.8rem; font-family: monospace; font-size: 0.85rem; color: #7ee787; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
    <h2>VeraCrypt / TrueCrypt Container Config (tcplay)</h2>
    <p class="subtitle">Mount encrypted volume files using <code>tcplay</code> (Debian APT compatible) and optionally export them over SMB shares.</p>

    <!-- Mount Container Form -->
    <div class="section">
        <div class="section-title">Mount Encrypted Volume</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Volume File Path (.hc / .tc)</label>
                <div class="path-input-group">
                    <input type="text" id="volumePath" placeholder="/mnt/data/vault.hc">
                    <button class="btn btn-secondary" onclick="openFileBrowser('file')">Browse...</button>
                </div>
            </div>
            <div class="form-group">
                <label>Mount Point Folder</label>
                <div class="path-input-group">
                    <input type="text" id="mountPoint" placeholder="/mnt/vault">
                    <button class="btn btn-secondary" onclick="openFileBrowser('folder')">Browse...</button>
                </div>
            </div>
            <div class="form-group">
                <label>Mapped Device Name</label>
                <input type="text" id="mapName" placeholder="tc_vault">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="volumePass" placeholder="••••••••">
            </div>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="autoSmb">
            <label for="autoSmb">Automatically share mounted volume via SMB network share</label>
        </div>
        <br>
        <button class="btn" onclick="mountVolume()">Mount Volume (tcplay)</button>
    </div>

    <!-- Active Mounted Volumes List -->
    <div class="section">
        <div class="section-title">Active Mounted Containers</div>
        <table>
            <thead>
                <tr>
                    <th>Mapped Device</th>
                    <th>Volume Path</th>
                    <th>Mount Point</th>
                    <th>Shared SMB</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="mountedTableBody">
                <tr><td colspan="5" style="text-align: center; color: #8b949e;">Loading active containers...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- File/Folder Browser Modal -->
    <div id="fileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalPath">/</span>
                <div class="modal-actions">
                    <button class="btn btn-secondary" style="padding: 0.2rem 0.6rem; font-size: 0.8rem;" onclick="createNewFolder()">+ Create Folder</button>
                    <button id="selectFolderBtn" class="btn" style="padding: 0.2rem 0.6rem; font-size: 0.8rem; display: none;" onclick="selectCurrentFolder()">Select This Folder</button>
                    <button class="btn btn-secondary" style="padding: 0.2rem 0.5rem;" onclick="closeModal()">✕</button>
                </div>
            </div>
            <div id="fileList" class="file-list"></div>
        </div>
    </div>

    <div id="outputBox" class="output-box"></div>

    <script>
        let mounts = [];

        async function loadMounts() {
            try {
                const res = await fetch('/api/plugin/data?plugin=veracrypt');
                const data = await res.json();
                mounts = data.mounts || [];
                renderMounts();
            } catch (err) {
                showOutput('Failed to load mounted volume list: ' + err.message);
            }
        }

        function renderMounts() {
            const tbody = document.getElementById('mountedTableBody');
            tbody.innerHTML = '';

            if (mounts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #8b949e;">No active VeraCrypt/tcplay containers recorded.</td></tr>';
                return;
            }

            mounts.forEach((m, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${m.map_name || 'tc_map'}</strong></td>
                    <td>${m.volume_path}</td>
                    <td>${m.mount_point}</td>
                    <td>${m.smb_shared ? 'Yes' : 'No'}</td>
                    <td>
                        <button class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="dismountVolume(${idx})">Dismount</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function saveMounts() {
            try {
                await fetch('/api/plugin/data?plugin=veracrypt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mounts: mounts })
                });
                renderMounts();
            } catch (err) {
                showOutput('Failed to save container data: ' + err.message);
            }
        }

        async function mountVolume() {
            const volume_path = document.getElementById('volumePath').value.trim();
            const mount_point = document.getElementById('mountPoint').value.trim();
            const map_name = document.getElementById('mapName').value.trim() || 'tc_volume';
            const password = document.getElementById('volumePass').value;
            const autoSmb = document.getElementById('autoSmb').checked;

            if (!volume_path || !mount_point || !password) {
                showOutput('Please specify Volume Path, Mount Point, Mapped Name, and Password.');
                return;
            }

            showOutput(`Mounting encrypted volume using tcplay...`);

            try {
                const res = await fetch('/api/plugin/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plugin: 'veracrypt',
                        cmd_key: 'mount_volume_sudo',
                        args: { volume_path, mount_point, password, map_name }
                    })
                });

                const data = await res.json();
                if (data.success) {
                    mounts.push({ volume_path, mount_point, map_name, smb_shared: autoSmb });
                    await saveMounts();

                    if (autoSmb) {
                        await addSmbShare(mount_point, map_name);
                    }

                    document.getElementById('volumePass').value = '';
                    showOutput(`Volume mounted successfully at ${mount_point}.\n` + data.output);
                } else {
                    showOutput('Mount failed: ' + data.error + '\n' + data.output);
                }
            } catch (err) {
                showOutput('Execution error: ' + err.message);
            }
        }

        async function dismountVolume(index) {
            const item = mounts[index];
            showOutput(`Dismounting ${item.mount_point}...`);

            try {
                const res = await fetch('/api/plugin/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plugin: 'veracrypt',
                        cmd_key: 'dismount_volume_sudo',
                        args: { mount_point: item.mount_point, map_name: item.map_name || 'tc_volume' }
                    })
                });

                const data = await res.json();
                if (data.success) {
                    mounts.splice(index, 1);
                    await saveMounts();
                    showOutput(`Dismounted ${item.mount_point}.\n` + data.output);
                } else {
                    showOutput('Dismount failed: ' + data.error + '\n' + data.output);
                }
            } catch (err) {
                showOutput('Execution error: ' + err.message);
            }
        }

        async function addSmbShare(path, name) {
            try {
                const res = await fetch('/api/plugin/data?plugin=smb');
                const data = await res.json();
                const shares = data.shares || [];
                shares.push({ name: name || 'VeraCryptShare', path: path, comment: 'Mounted encrypted volume', read_only: false, enabled: true });

                await fetch('/api/plugin/data?plugin=smb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shares: shares })
                });
            } catch (err) {
                console.error('Failed to auto-add SMB share:', err);
            }
        }

        /* File / Folder Browser Modal */
        let currentBrowserPath = '/';
        let browseTargetMode = 'file';

        async function openFileBrowser(mode, path) {
            browseTargetMode = mode;
            currentBrowserPath = path || currentBrowserPath;

            document.getElementById('modalPath').innerText = currentBrowserPath;
            document.getElementById('selectFolderBtn').style.display = (mode === 'folder') ? 'inline-block' : 'none';
            document.getElementById('fileModal').style.display = 'block';

            try {
                const res = await fetch(`/api/fs/browse?path=${encodeURIComponent(currentBrowserPath)}`);
                const data = await res.json();
                const container = document.getElementById('fileList');
                container.innerHTML = '';

                if (data.parent && data.parent !== currentBrowserPath) {
                    const upDiv = document.createElement('div');
                    upDiv.className = 'file-item';
                    upDiv.innerText = '📁 .. (Parent Directory)';
                    upDiv.onclick = () => openFileBrowser(browseTargetMode, data.parent);
                    container.appendChild(upDiv);
                }

                if (data.items) {
                    data.items.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'file-item';
                        itemDiv.innerText = (item.is_dir ? '📁 ' : '📄 ') + item.name;
                        itemDiv.onclick = () => {
                            if (item.is_dir) {
                                openFileBrowser(browseTargetMode, item.path);
                            } else if (browseTargetMode === 'file') {
                                selectFile(item.path);
                            }
                        };
                        container.appendChild(itemDiv);
                    });
                }
            } catch (err) {
                showOutput('Directory listing error: ' + err.message);
            }
        }

        async function createNewFolder() {
            const folderName = prompt(`Create new folder inside ${currentBrowserPath}:`);
            if (!folderName) return;

            const cleanFolder = folderName.trim().replace(/[^a-zA-Z0-9_\-]/g, '_');
            const targetPath = (currentBrowserPath === '/' ? '' : currentBrowserPath) + '/' + cleanFolder;

            try {
                const res = await fetch('/api/fs/mkdir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: targetPath })
                });
                const data = await res.json();
                if (data.success) {
                    openFileBrowser(browseTargetMode, currentBrowserPath);
                } else {
                    showOutput('Failed to create folder: ' + data.error);
                }
            } catch (err) {
                showOutput('Failed to create folder: ' + err.message);
            }
        }

        function selectFile(path) {
            document.getElementById('volumePath').value = path;
            const filename = path.split('/').pop().split('.')[0].replace(/[^a-zA-Z0-9_]/g, '_');
            if (filename) {
                document.getElementById('mountPoint').value = `/mnt/${filename}`;
                document.getElementById('mapName').value = 'tc_' + filename;
            }
            closeModal();
        }

        function selectCurrentFolder() {
            document.getElementById('mountPoint').value = currentBrowserPath;
            closeModal();
        }

        function closeModal() {
            document.getElementById('fileModal').style.display = 'none';
        }

        function showOutput(text) {
            const box = document.getElementById('outputBox');
            box.style.display = 'block';
            box.innerText = text;
        }

        window.onload = loadMounts;
    </script>
</body>
</html>
